<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Styles Panel Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ---------- Intended base ---------- */
    :root {
      --brand: #5a67d8;
      --text: #222;
      --muted: #666;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: var(--text);
    }

    .wrap { padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eaeaea;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
    }

    .hero {
      margin-top: 16px;
      border: 1px solid #eaeaea;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
    }

    .hero h1 {
      margin: 0 0 8px 0;
      font-size: clamp(1.6rem, 3vw, 2.6rem);
    }

    .muted { color: var(--muted); }

    .cta {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--brand);
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      padding: 16px;
    }

    .badge {
      display: inline-block;
      background: #eef;
      color: #223;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    footer {
      margin: 24px 0 8px 0;
      color: #bfbfbf;
    }

    /* ---------- Beginner-level bugs ---------- */

    nav a {
      colour: #555;
    }

    .cta {
      background: var(--brand)
      color: #fff;
    }

    .hero {
        border-color: var(--brandd, #eaeaea);
    }

    .badge {
      font-size: 12xp;
    }

    .wrap .container {
        margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <header>
        <strong>FitCo</strong>
        <nav>
          <a href="#">Home</a>
          <a href="#">Programmes</a>
          <a href="#">Contact</a>
        </nav>
      </header>

      <section class="hero">
        <h1>Styles Panel Debugging</h1>
        <p class="muted">Use the <strong>Elements → Styles</strong> tab to fix each visible issue.</p>
        <a class="cta" href="#">Start free trial</a>

        <div class="grid">
          <div class="card">
            <p><span class="badge">Badge</span> Fix link colour, button text, and centring.</p>
          </div>
        </div>
      </section>

      <footer>
        <small>© 2025 FitCo • Made with care</small>
      </footer>
    </div>
  </div>

</body>
</html>
