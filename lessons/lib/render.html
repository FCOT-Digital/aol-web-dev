<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Markdown Renderer</title>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
	<style id="palette">
		html {
			--background: hsl(0, 0%, 100%);
			--main: hsl(0, 0%, 15%);
			--action: hsl(120, 100%, 15%);
			--alternate: hsl(300, 100%, 15%);
		}
		@media (prefers-color-scheme: dark) {
			html {
				--background: hsl(0, 0%, 0%);
				--main: hsl(0, 0%, 85%);
				--action: hsl(120, 100%, 85%);
				--alternate: hsl(300, 100%, 85%);
			}
		}
	</style>
	<style>
		html {
			background: var(--background);
			color: var(--main);
			font-family: "Quicksand", sans-serif;
			text-align: justify;
			font-size: 3vh;
		}
		body {
			margin: 0;
			padding: 0.5rem;
		}
		nav {
			display: flex;
			flex-wrap: wrap;
			gap: 1rem;
			margin: 0.5rem;
			> * {
				flex-grow: 1;
				text-align: center;
				padding: 1rem;
				border: 0;
				font-family: "Quicksand", sans-serif;
				font-size: 100%;
				font-weight: bolder;
				background: var(--main);
				color: var(--background);
				border-radius: 1.5rem;
			}
			> *.call-to-action {
				background: var(--action);
			}
		}
		main {
			margin: 0.5rem;
			line-height: 150%;
		}
		a {
			color: var(--action);
			text-decoration: none;
			font-style: italic;
		}
		img {
			max-width: calc(100vw - 2rem);
			max-height: calc(100vh - 2rem);
		}
		h1, h2, h3, h4, h5, h6 {
			color: var(--action);
			font-family: monospace;
		}
		em {
			color: var(--alternate);
		}
		@media print {
			nav {
				display: none;
			}
			hr {
				page-break-after: always;
				border: none;
			}
		}
	</style>
</head>
<body>
	<div id="app">
		<nav>
			<button
				v-bind:class="{ 'call-to-action': !file_text && !pending }"
				v-on:drop.prevent="handleDrop"
				ondragover="event.preventDefault()"
			>
				Drop Markdown File Here
			</button>
		</nav>
		<main v-html="rendered_file"></main>
	</div>
	
	<script>
		Vue.createApp({
			data() {
				return {
					pending: false,
					file_text: null,
					page_count: 0,
					current_page: null,
				};
			},
			computed: {
				rendered_file() {
					return this.file_text ? '<hr>' + marked.parse(this.file_text) : '';
				},
			},
			mounted() {
				window.addEventListener('keydown', this.handleKeyPress);
			},
			methods: {
				async handleDrop(event) {
					this.pending = true;
					const files = event.dataTransfer && event.dataTransfer.files
					const file = files && files[0];
					if (file) {
						this.file_text = await file.text();
						const lines = this.file_text.split('\n');
						const splitters = lines.filter(line => line.trim() === '---');
						this.page_count = splitters.length + 1;
						this.current_page = null;
					}
					this.pending = false;
				},
				handleKeyPress(event) {
					if (event.key === 'PageUp') {
						event.preventDefault();
						if (this.current_page > 0) {
							this.current_page = this.current_page - 1;
						}
						this.scrollToPage(this.current_page);
					} else if (event.key === 'PageDown') {
						event.preventDefault();
						if (this.current_page === null) {
							this.current_page = 0;
						} else if (this.current_page < this.page_count - 1) {
							this.current_page = this.current_page + 1;
						}
						this.scrollToPage(this.current_page);
					}
				},
				scrollToPage(page) {
					const splitters = document.querySelectorAll('hr');
					splitters[page]?.scrollIntoView({ behavior: 'smooth' });
				},
			},
		}).mount('#app');
	</script>
</body>
</html>
