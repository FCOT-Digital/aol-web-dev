<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
    	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="/static/18_signup.js" defer></script>
    </head>
    <body>
        <h1>Sign Up To This Totally Awesome App!</h1>
        <p>{{ message }}</p>
        <form id="signup-form" v-on:submit.prevent="submitForm">
            <label for="given_name">Name:</label>
            <input type="text" id="given_name" v-model="given_name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" v-model="email" required><br><br>

            <button type="submit">Sign Up</button>
        </form>
    </body>
</html>
