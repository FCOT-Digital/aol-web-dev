<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<title>Computed values</title>
</head>
<body>
	<div id="app">
		<input v-model="person" placeholder="Enter your name">
	</div>
	
	<script>
		Vue.createApp({
			data() {
				return {
					person: "John",
				};
			},
            watch: {
                person(newValue) {
                    console.log(`Person changed to ${newValue}`);
                }
            }
		}).mount('#app');
	</script>
</body>
</html>
